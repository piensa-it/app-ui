name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    # Code scanning uploads require GitHub Advanced Security on private repos.
    # Keep the workflow ready so it activates automatically after publication.
    #
    # `[skip codeql]` en el mensaje del commit salta el escaneo SOLO para ese
    # push (no para PRs ni para el cron semanal, donde `head_commit` es null y
    # el `contains` da false). Sirve para no gastar ~7 min de Actions en el push
    # del commit de release, cuyo código ya cotejó la constancia local.
    if: >-
      github.event.repository.private == false &&
      !contains(github.event.head_commit.message, '[skip codeql]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Build
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
