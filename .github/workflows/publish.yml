name: Publish package

# Se dispara al publicar un Release en GitHub (crea el tag automáticamente).
# Flujo recomendado: bump de "version" en package.json vía PR -> merge a
# main -> crear el Release en GitHub apuntando a ese commit.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@piensa-it"

      - run: npm ci

      - run: npm run lint

      - name: TypeScript strict check
        run: npx tsc --noEmit -p tsconfig.app.json

      - run: npm run test:run

      # Defensa en profundidad: ci.yml ya corre esto en el PR, pero repetirlo
      # acá evita publicar a npm si el estado de `main` cambió entre el merge
      # y la creación del Release (o si el Release apunta a un commit distinto
      # al que pasó CI). verify:package hace `npm run build` + valida que
      # React/Ark UI/TanStack/Recharts sigan externalizados y que el bundle
      # no exceda el presupuesto de tamaño — es estrictamente más que
      # `npm run build` solo, así que reemplaza ese paso.
      - name: Verificar build, tipos y tamaño del paquete
        run: npm run verify:package

      - name: Publicar en GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
