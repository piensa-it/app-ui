name: Release integrity and publish

# Se dispara al publicar un Release en GitHub (crea el tag automáticamente).
# Flujo recomendado: bump de "version" en package.json vía PR -> merge a
# main -> crear el Release en GitHub apuntando a ese commit.
on:
  release:
    types: [published]

jobs:
  publish:
    environment: package-release
    concurrency:
      group: package-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@piensa-it"

      - name: Verify that the release commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - run: npm ci

      - name: Verificar tag semántico y versión del paquete
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/validate-release.mjs

      # Lint, tipos, cobertura, contrato, React 18, Storybook y navegador ya
      # los certifica la constancia firmada en local (DEPLOYMENT.md): si el
      # commit del Release no es el que se probó, no se publica.
      - name: Cotejar la constancia de pruebas
        run: |
          RESULTADO="$(node scripts/evidencia-pruebas.mjs cotejar)"
          echo "Constancia: $RESULTADO"
          [ "$RESULTADO" = "valida" ] || { echo "::error::El commit del Release no tiene constancia de pruebas válida. Corre \`npm run pruebas\`."; exit 1; }

      # verify:package hace `npm run build` y valida externos y tamaño: el build
      # que se publica tiene que salir de este runner.
      - name: Build y verificación del paquete
        run: npm run verify:package

      - name: Publicar en GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
