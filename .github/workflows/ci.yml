name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch and PR title
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-metadata.mjs

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Audit de dependencias publicadas
        # --omit=dev: las devDependencies (vite/esbuild) nunca se publican en
        # el paquete — solo se usan para build local/CI. Auditamos con la
        # misma superficie que realmente instala un consumidor.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build de la librería
        run: npm run verify:package

      - name: Build del sitio de documentación (Storybook)
        run: npm run build-storybook

  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and visual tests
        run: npm run test:browser
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Cuando el gate falla, Playwright deja en disco lo que acaba de
      # renderizar. Subirlo permite comparar contra la referencia de Linux —o
      # crearla— sin tener que reproducir el entorno del runner en local.
      - name: Upload generated snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-linux
          path: tests/browser/__screenshots__/
          retention-days: 7

  deploy-docs:
    # El sitio de documentación se publicaba por la integración Git de
    # Netlify, que construía por su cuenta sin mirar los checks — y que dejó
    # de dispararse en agosto, congelando el sitio casi un mes sin aviso.
    # Publicarlo desde acá lo vuelve visible junto al resto del CI y garantiza
    # que solo salga a producción lo que ya pasó calidad y navegador.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, browser-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build del sitio de documentación (Storybook)
        run: npm run build-storybook
      - name: Publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Via env var y no interpolado en el `run`: el mensaje de commit es
          # texto arbitrario y no debe llegar al shell como código.
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Netlify manda el mensaje en la URI de la petición, y el de un merge
          # squash trae el cuerpo entero de todos los commits de la rama. Con
          # eso responde "Request URI Too Long" y el sitio se queda sin
          # actualizar, que es lo que pasó al publicar la 0.5.0. Basta el
          # asunto, recortado.
          MENSAJE=$(printf '%s' "$DEPLOY_MESSAGE" | head -n 1 | cut -c1-120)
          npx --yes netlify-cli@27 deploy \
            --dir=storybook-static \
            --prod \
            --message "$MENSAJE"
