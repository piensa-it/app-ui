name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch and PR title
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-metadata.mjs

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Audit de dependencias publicadas
        # --omit=dev: las devDependencies (vite/esbuild) nunca se publican en
        # el paquete — solo se usan para build local/CI. Auditamos con la
        # misma superficie que realmente instala un consumidor.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build de la librería
        run: npm run verify:package

      - name: Build del sitio de documentación (Storybook)
        run: npm run build-storybook
