name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch and PR title
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-metadata.mjs

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Audit de dependencias publicadas
        # --omit=dev: las devDependencies (vite/esbuild) nunca se publican en
        # el paquete — solo se usan para build local/CI. Auditamos con la
        # misma superficie que realmente instala un consumidor.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Contrato público (stories y pruebas de humo)
        run: npm run verify:contract

      - name: Build de la librería
        run: npm run verify:package

      - name: Build del sitio de documentación (Storybook)
        run: npm run build-storybook

  # Solo corre en el PR que sube `version` en package.json — el de release.
  # Por qué aquí y no en cada push (#172): `verify:react18` existe desde hace
  # tiempo pero no lo corría nadie, y por eso el código de la librería dejó de
  # compilar con los tipos de React 18 durante tres versiones sin que se viera.
  # Medido antes de decidir dónde ponerlo: el `dist/index.d.ts` publicado sale
  # idéntico byte a byte con y sin ese fallo, así que a ningún consumidor le
  # llegó nada roto — lo que estaba roto era la comprobación, no la promesa.
  # Con ese impacto real, gastar ~3 minutos en cada PR era desproporcionado;
  # justo antes de publicar, que es lo único que importa, no lo es.
  #
  # El día que la librería sea React 19 exclusivo (#174), este job se borra.
  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Hace falta el commit base para comparar la versión contra él.
          fetch-depth: 0

      - name: ¿Este PR sube la versión?
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA":package.json > /tmp/package.base.json
          antes="$(node -p "require('/tmp/package.base.json').version")"
          ahora="$(node -p "require('./package.json').version")"
          if [ "$antes" = "$ahora" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "La versión sigue en $ahora: este no es el PR de release, no se comprueba React 18."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Versión $antes → $ahora: es el PR de release, se comprueba React 18."
          fi

      - uses: actions/setup-node@v7
        if: steps.version.outputs.bumped == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
        if: steps.version.outputs.bumped == 'true'

      - name: React 18 sigue soportado (lo declara peerDependencies)
        if: steps.version.outputs.bumped == 'true'
        run: npm run verify:react18

  browser-gate:
    runs-on: ubuntu-latest
    # Corre DENTRO de la imagen oficial de Playwright, la misma que usa
    # `npm run test:browser:docker` en local. Dos motivos:
    #
    # 1. Antes el job instalaba Chromium con `playwright install --with-deps`,
    #    que hace `apt-get` contra el repositorio de Google. El 2026-09-09 ese
    #    espejo sirvió un índice con el hash desajustado y el gate falló en
    #    todos los PR por algo ajeno al código. La imagen ya trae navegador y
    #    dependencias: no hay `apt` que pueda caerse.
    # 2. Las capturas comparadas de Linux se generan en local con esa misma
    #    imagen. Que CI use otra era pedir que dos entornos distintos
    #    rasterizaran igual; ahora coinciden por construcción.
    #
    # La etiqueta debe seguir a la versión de `@playwright/test` en
    # package.json; `verify:package` lo comprueba y falla si divergen.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run browser and visual tests
        run: npm run test:browser
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Cuando el gate falla, Playwright deja en disco lo que acaba de
      # renderizar. Subirlo permite comparar contra la referencia de Linux —o
      # crearla— sin tener que reproducir el entorno del runner en local.
      - name: Upload generated snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-linux
          path: tests/browser/__screenshots__/
          retention-days: 7

  deploy-docs:
    # El sitio de documentación se publicaba por la integración Git de
    # Netlify, que construía por su cuenta sin mirar los checks — y que dejó
    # de dispararse en agosto, congelando el sitio casi un mes sin aviso.
    # Publicarlo desde acá lo vuelve visible junto al resto del CI y garantiza
    # que solo salga a producción lo que ya pasó calidad y navegador.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, browser-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build del sitio de documentación (Storybook)
        run: npm run build-storybook
      - name: Publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Via env var y no interpolado en el `run`: el mensaje de commit es
          # texto arbitrario y no debe llegar al shell como código.
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Netlify manda el mensaje en la URI de la petición, y el de un merge
          # squash trae el cuerpo entero de todos los commits de la rama. Con
          # eso responde "Request URI Too Long" y el sitio se queda sin
          # actualizar, que es lo que pasó al publicar la 0.5.0. Basta el
          # asunto, recortado.
          MENSAJE=$(printf '%s' "$DEPLOY_MESSAGE" | head -n 1 | cut -c1-120)
          npx --yes netlify-cli@27 deploy \
            --dir=storybook-static \
            --prod \
            --message "$MENSAJE"
