name: Deploy component docs (Storybook)

# Publica el sitio de documentación de componentes (Storybook) a GitHub
# Pages en cada push a main. Este sitio es independiente del paquete npm:
# siempre refleja el código fuente actual del repo, no la última versión
# publicada. Los demás repos (MisFin, Lynx, etc.) enlazan a esta URL desde
# su nav/footer — no la instalan como dependencia.
#
# Requiere habilitar GitHub Pages en Settings > Pages > Source: "GitHub
# Actions" (una sola vez, manual).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
