version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@ark-ui/react"
      - dependency-name: "@zag-js/*"
      # Playwright se sube a mano, junto con la imagen de ci.yml y las capturas
      # de Linux regeneradas: subirlo solo rompía `browser-gate` y
      # `verify:package` en cada PR de Dependabot (#210) y llegaba por correo.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: America/Bogota
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions

