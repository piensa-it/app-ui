name: Feature request
description: Suggest a reusable component or design-system improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Product need
      description: What recurring user or developer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Describe the behavior, accessibility needs, and API shape.
    validations:
      required: true

